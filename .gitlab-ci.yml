# Builds and tests the monorepo, then copies the built site to the server.
#
# The deploy step copies the site with rsync over SSH into a `static/` folder
# on the server. It runs only on master, and only once the variables below
# exist under Settings > CI/CD > Variables:
#
#   SSH_PRIVATE_KEY   The private key of the deploy user (type: File).
#   SSH_KNOWN_HOSTS   The server's host keys, as printed by ssh-keyscan (type: File).
#   DEPLOY_HOST       The server's address.
#   DEPLOY_USER       The user to log in as.
#   DEPLOY_PATH       The folder to copy into. It must end in /static/.

stages:
  - build
  - deploy

build:
  stage: build
  image: node:24
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - npm run typecheck
    # The site's tests build the site again, with the production address.
    - npm test
    # Strict Check on the site itself, against its own theme: the code, and five
    # built pages in a browser. The image has no browser, so one is installed.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends chromium > /dev/null
    - npm run strict-check -w apps/site -- --report "$CI_PROJECT_DIR/strict-check.txt"
    - echo "$CI_COMMIT_SHORT_SHA $CI_COMMIT_REF_NAME $(date -u '+%F %T UTC')" > apps/site/dist/deploy.txt
  artifacts:
    # Kept when the job fails too: a failed check is the one whose report gets read.
    when: always
    paths:
      - apps/site/dist/
      - strict-check.txt
    expire_in: 1 week

deploy:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == "master" && $SSH_PRIVATE_KEY && $SSH_KNOWN_HOSTS && $DEPLOY_HOST && $DEPLOY_USER && $DEPLOY_PATH
  resource_group: production
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    # A key pasted into the variable form can arrive with Windows line ends and
    # without a final line end. OpenSSH refuses both, so clean the copy.
    - (tr -d '\r' < "$SSH_PRIVATE_KEY"; echo) > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
  script:
    # --delete removes files on the server that are not in the build, so the
    # target must be the site's own folder and nothing else.
    - case "$DEPLOY_PATH" in */static/) ;; *) echo "DEPLOY_PATH must end in /static/"; exit 1 ;; esac
    - test -f apps/site/dist/index.html
    - >
      rsync -rlz --delete --chmod=D755,F644
      --filter='P .well-known/'
      apps/site/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"
