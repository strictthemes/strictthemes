# Builds and tests the monorepo on every pull request and on master.
#
# This repository is a mirror: the project lives on GitLab, which builds,
# tests and deploys the site (.gitlab-ci.yml). These checks run here too, so
# pull requests on GitHub get the same feedback.

name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the run before it. A run on master is never cut short.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      # The site's tests build the site again, with the production address.
      - run: npm test
      # Strict Check on the site itself, against its own theme: the code, and
      # seven built pages in the runner's Chrome.
      # It runs through this repo's own action (action.yml), with the checker
      # built above in place of the one on npm. The same options are in
      # `strict-check` in apps/site/package.json, for running it by hand.
      - name: Strict Check on the site
        uses: ./
        with:
          command: node packages/check/dist/cli.js
          dir: apps/site
          spec: packages/themes/themes/strict-one/DESIGN.md
          dist: dist
          paths: / /themes/ /spec/ /themes/strict-one/ /kit/ /kit/strict-one/ /guides/ /guides/design-md-from-your-site/ /guides/ai-slop-ui-tells/ /guides/contrast-for-non-designers/ /guides/dark-mode-with-tokens-tailwind-4/ /guides/design-md-agents-md-rules/ /guides/design-md-with-bootstrap/ /guides/design-skill-for-your-agent/ /guides/design-tokens-for-coding-agents/ /guides/design-tokens-in-html-email/ /guides/install-a-shadcn-theme/ /guides/pricing-page-three-themes/ /guides/publish-and-check-live-page/ /guides/shadcn-blocks-and-registries/ /guides/strict-check-in-ci/ /guides/what-is-design-md/ /404.html
          args: --exclude examples --exclude .kit --mode light
      # The agent kit, as the registry writes it for each theme: in every theme,
      # both color modes and two widths, with hover and focus.
      - name: Strict Check on the agent kit in every theme
        run: npm run strict-check:kit -w apps/site
      - name: Stamp the build
        run: echo "${GITHUB_SHA::8} $GITHUB_REF_NAME $(date -u '+%F %T UTC')" > apps/site/dist/deploy.txt
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: apps/site/dist/
          # The site has a .htaccess file. Without it the deploy would delete the one on the server.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: strict-check
          path: strict-check.*
          if-no-files-found: ignore
          retention-days: 7

